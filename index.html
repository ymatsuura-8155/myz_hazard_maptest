    // --- HELPER FUNCTIONS ---
    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = (lat1 * Math.PI) / 180;
      const phi2 = (lat2 * Math.PI) / 180;
      const deltaPhi = ((lat2 - lat1) * Math.PI) / 180;
      const deltaLambda = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function latLngToTilePixel(lat, lng, zoom = 16) {
      const n = Math.pow(2, zoom);
      const xTileExact = ((lng + 180) / 360) * n;
      const latRad = (lat * Math.PI) / 180;
      const yTileExact = ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n;
      const x = Math.floor(xTileExact);
      const y = Math.floor(yTileExact);
      const px = Math.min(255, Math.max(0, Math.floor((xTileExact - x) * 256)));
      const py = Math.min(255, Math.max(0, Math.floor((yTileExact - y) * 256)));
      return { x, y, px, py };
    }

    function mapColorToRiskLevel(r, g, b, a) {
      if (a < 30) return 'none';
      const targets = [
        { level: 'above_20_0', r: 220, g: 122, b: 220 },
        { level: '10_0_to_20_0', r: 242, g: 133, b: 201 },
        { level: '5_0_to_10_0', r: 255, g: 145, b: 145 },
        { level: '3_0_to_5_0', r: 255, g: 183, b: 183 },
        { level: '0_5_to_3_0', r: 255, g: 216, b: 192 },
        { level: 'below_0_5', r: 247, g: 245, b: 169 }
      ];
      let closest = 'below_0_5';
      let minDiff = 999999;
      for (const t of targets) {
        const d = Math.sqrt(Math.pow(r - t.r, 2) + Math.pow(g - t.g, 2) + Math.pow(b - t.b, 2));
        if (d < minDiff) {
          minDiff = d;
          closest = t.level;
        }
      }
      if (minDiff > 120 && (r < 100 || g < 100 || b < 100)) return 'none';
      return closest;
    }

    async function sampleGsiFloodTile(lat, lng) {
      const zoom = 16;
      const { x, y, px, py } = latLngToTilePixel(lat, lng, zoom);
      const tileUrl = `https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/${zoom}/${x}/${y}.png`;
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const timer = setTimeout(() => resolve(null), 3500);
        img.onload = () => {
          clearTimeout(timer);
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            if (!ctx) return resolve(null);
            ctx.drawImage(img, 0, 0);
            const p = ctx.getImageData(px, py, 1, 1).data;
            resolve(mapColorToRiskLevel(p[0], p[1], p[2], p[3]));
          } catch { resolve(null); }
        };
        img.onerror = () => { clearTimeout(timer); resolve('none'); };
        img.src = tileUrl;
      });
    }

    async function geocodeAddress(query) {
      const clean = query.trim();
      if (!clean) return null;
      const match = SAMPLE_LOCATIONS.find(s => s.name.includes(clean) || s.address.includes(clean) || clean.includes(s.name) || clean.includes(s.address));
      if (match) return { lat: match.lat, lng: match.lng, displayName: match.address };

      try {
        const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(clean.startsWith('宮崎') ? clean : '宮崎市 ' + clean)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            for (const item of data) {
              if (item.geometry && Array.isArray(item.geometry.coordinates)) {
                const [lon, lat] = item.geometry.coordinates;
                const title = item.properties?.title || '';
                if (lat >= 31.65 && lat <= 32.22 && lon >= 131.10 && lon <= 131.65) {
                  return { lat, lng: lon, displayName: title.includes('宮崎') ? title : `宮崎県宮崎市 ${title}` };
                }
              }
            }
          }
        }
      } catch (e) {}

      return { lat: 31.9077, lng: 131.4202, displayName: `宮崎県宮崎市（${clean} 付近）` };
    }

    async function getGsiElevation(lat, lng) {
      try {
        const url = `https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lng}&lat=${lat}&outtype=JSON`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.elevation === 'number') return Math.round(data.elevation * 10) / 10;
        }
      } catch {}
      return null;
    }

    function getLocalMiyazakiRiskEstimation(lat, lng, elevation) {
      const distToOyodo = calculateDistanceMeters(lat, lng, 31.906, 131.422);
      if (distToOyodo < 1200) return '0_5_to_3_0';
      if (elevation !== null && elevation < 5) return 'below_0_5';
      return 'none';
    }

    function findNearbyShelters(lat, lng, maxCount = 6) {
      const withDist = MIYAZAKI_SHELTERS.map(s => {
        const d = calculateDistanceMeters(lat, lng, s.lat, s.lng);
        return { ...s, distanceMeters: d, walkingMinutes: Math.max(1, Math.round(d / 80)) };
      });
      withDist.sort((a, b) => (a.distanceMeters || 0) - (b.distanceMeters || 0));
      return withDist.slice(0, maxCount);
    }

    async function analyzeHazardForLocation(lat, lng, address) {
      const [tileRisk, elevation] = await Promise.all([
        sampleGsiFloodTile(lat, lng),
        getGsiElevation(lat, lng)
      ]);
      const riskLevel = tileRisk !== null ? tileRisk : getLocalMiyazakiRiskEstimation(lat, lng, elevation);
      const def = INUNDATION_RANK_DEFINITIONS.find(d => d.level === riskLevel) || INUNDATION_RANK_DEFINITIONS[0];
      const dist = MIYAZAKI_DISTRICTS.find(d => calculateDistanceMeters(lat, lng, d.center[0], d.center[1]) < 4000);

      return {
        address,
        lat,
        lng,
        isInundationZone: riskLevel !== 'none',
        riskLevel,
        depthLabel: def.depthLabel,
        depthRangeText: def.depthRangeText,
        estimatedDepthMeters: def.estimatedDepthMeters,
        humanImpact: def.humanImpact,
        buildingImpact: def.buildingImpact,
        evacuationAction: def.evacuationAction,
        warningColor: def.color,
        elevationMeters: elevation,
        durationEstimate: riskLevel === 'none' ? '浸水想定なし' : riskLevel === 'below_0_5' ? '12時間未満' : '12時間〜3日間程度',
        relatedRivers: dist ? dist.mainRivers : ['大淀川'],
        districtName: dist ? dist.name : '宮崎市内'
      };
    }

            {searchError && (
              <div className="mb-6 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold">
                {searchError}
              </div>
            )}

            {/* Diagnostic Card */}
            {hazardResult && (
              <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 mb-6" style={{ borderTopWidth: '4px', borderTopColor: isSafe ? '#10b981' : hazardResult.warningColor }}>
                <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 pb-6 border-b border-slate-100">
                  <div>
                    <span className="px-3 py-1 rounded-full text-xs font-bold" style={{ backgroundColor: isSafe ? '#d1fae5' : '#fee2e2', color: isSafe ? '#047857' : '#b91c1c' }}>
                      {isSafe ? '浸水想定なし (区域外)' : '浸水想定区域内 (リスクあり)'}
                    </span>
                    <h2 className="text-xl sm:text-2xl font-black text-slate-900 mt-2">
                      {hazardResult.address}
                    </h2>
                    <p className="text-xs sm:text-sm text-slate-500 font-medium mt-1">
                      地区: {hazardResult.districtName} / 関連河川: {hazardResult.relatedRivers.join(', ')} / 標高: {hazardResult.elevationMeters !== null ? `${hazardResult.elevationMeters}m` : '—'}
                    </p>
                  </div>

                  <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-center min-w-[220px]">
                    <span className="text-[11px] font-bold text-slate-400 block uppercase">想定浸水深</span>
                    <span className="text-3xl sm:text-4xl font-black" style={{ color: isSafe ? '#10b981' : hazardResult.warningColor }}>
                      {hazardResult.depthRangeText}
                    </span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-6 text-xs sm:text-sm">
                  <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <strong className="text-slate-900 block mb-1 font-bold">人体・歩行への影響</strong>
                    <p className="text-slate-600 leading-relaxed font-medium">{hazardResult.humanImpact}</p>
                  </div>
                  <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <strong className="text-slate-900 block mb-1 font-bold">家屋・生活環境</strong>
                    <p className="text-slate-600 leading-relaxed font-medium">{hazardResult.buildingImpact}</p>
                  </div>
                  <div className="p-4 bg-blue-50 rounded-2xl border border-blue-200">
                    <strong className="text-blue-950 block mb-1 font-bold">推奨避難行動</strong>
                    <p className="text-blue-900 leading-relaxed font-medium">{hazardResult.evacuationAction}</p>
                  </div>
                </div>
              </div>
            )}

            {/* Visual Simulation Cross Section */}
            {hazardResult && (
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-base sm:text-lg font-black text-slate-900">
                    想定浸水深の視覚シミュレーション
                  </h3>
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-700">
                    人(170cm) と 2階建て木造住宅(約7m)
                  </span>
                </div>

                <div className="relative bg-gradient-to-b from-sky-50 to-slate-100 rounded-2xl p-5 border border-slate-200 overflow-hidden min-h-[260px] flex flex-col justify-end">
                  {!isSafe && (
                    <div
                      className="absolute bottom-0 left-0 right-0 z-10 transition-all duration-700"
                      style={{
                        height: `${visualPercent}%`,
                        background: 'linear-gradient(to top, rgba(30, 64, 175, 0.75), rgba(59, 130, 246, 0.55))',
                        borderTop: `3px solid ${hazardResult.warningColor}`
                      }}
                    >
                      <div className="absolute top-2 right-4 bg-slate-900 text-white text-xs px-3 py-1 rounded-xl font-bold">
                        浸水線: {hazardResult.depthRangeText}
                      </div>
                    </div>
                  )}

                  <div className="relative z-0 flex items-end justify-around max-w-xl mx-auto w-full pb-2">
                    {/* House */}
                    <div className="text-center">
                      <svg width="180" height="200" viewBox="0 0 200 220">
                        <polygon points="100,10 15,60 185,60" fill="#475569" />
                        <rect x="30" y="60" width="140" height="65" fill="#f8fafc" stroke="#334155" strokeWidth="2" />
                        <text x="100" y="95" textAnchor="middle" fontSize="11" fill="#64748b" fontWeight="bold">2階居室</text>
                        <rect x="30" y="125" width="140" height="75" fill="#f1f5f9" stroke="#334155" strokeWidth="2" />
                        <text x="100" y="165" textAnchor="middle" fontSize="11" fill="#64748b" fontWeight="bold">1階居室</text>
                        <rect x="20" y="200" width="160" height="15" fill="#94a3b8" />
                      </svg>
                      <span className="text-xs font-bold text-slate-700">2階建住宅(約7m)</span>
                    </div>

                    {/* Human */}
                    <div className="text-center pb-1">
                      <svg width="40" height="85" viewBox="0 0 40 85">
                        <circle cx="20" cy="14" r="9" fill="#fbbf24" stroke="#d97706" />
                        <rect x="14" y="23" width="12" height="32" rx="3" fill="#3b82f6" />
                        <line x1="16" y1="55" x2="14" y2="82" stroke="#1e293b" strokeWidth="4" />
                        <line x1="24" y1="55" x2="26" y2="82" stroke="#1e293b" strokeWidth="4" />
                      </svg>
                      <span className="text-xs font-bold text-slate-700">大人(170cm)</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Interactive Leaflet Map */}
            <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 mb-6">
              <div className="flex justify-between items-center mb-3">
                <span className="text-sm font-bold text-slate-800">
                  宮崎市 洪水ハザードマップ（地図をクリックで任意地点を判定）
                </span>
                <span className="text-xs text-slate-400">国土地理院タイル重畳 (Canvas描画有効)</span>
              </div>
              <div ref={mapContainerRef} className="w-full h-[400px] min-h-[400px] relative rounded-2xl border border-slate-200 z-0" />
            </div>

            {/* Nearest Shelters List */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 mb-6">
              <h3 className="text-lg font-black text-slate-900 mb-4 pb-2 border-b border-slate-100">
                周辺の指定緊急避難場所（洪水対応）
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {nearbyShelters.map((s, idx) => (
                  <div key={s.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-start mb-1">
                        <span className="font-black text-slate-900 text-sm">{idx + 1}. {s.name}</span>
                        <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">洪水対応</span>
                      </div>
                      <p className="text-xs text-slate-500 mb-2">{s.address} ({s.structure})</p>
                      <div className="text-xs bg-white p-2.5 rounded-xl border border-slate-200 mb-2 flex justify-between font-bold">
                        <span>直線距離: 約 {s.distanceMeters} m</span>
                        <span>徒歩目安: 約 {s.walkingMinutes} 分</span>
                      </div>
                      {s.notes && <p className="text-[11px] text-amber-900 bg-amber-50 p-2 rounded-lg mb-2">💡 {s.notes}</p>}
                    </div>
                    <div className="flex justify-between items-center pt-2 border-t border-slate-200 text-xs">
                      <a href={`tel:${s.phone}`} className="font-bold text-slate-600 hover:text-blue-600">📞 {s.phone}</a>
                      <a href={`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(currentAddress)}&destination=${encodeURIComponent(s.name + ' ' + s.address)}`} target="_blank" rel="noreferrer" className="px-3 py-1.5 bg-blue-600 text-white rounded-xl font-bold">
                        ルート案内
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Preparedness, Levels & Checklist */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 mb-6">
              <div className="flex gap-2 mb-5 border-b border-slate-100 pb-3">
                <button onClick={() => setPrepTab('levels')} className={`px-4 py-2 rounded-xl text-xs font-bold ${prepTab === 'levels' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                  警戒レベル
                </button>
                <button onClick={() => setPrepTab('rivers')} className={`px-4 py-2 rounded-xl text-xs font-bold ${prepTab === 'rivers' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                  主要河川情報
                </button>
                <button onClick={() => setPrepTab('checklist')} className={`px-4 py-2 rounded-xl text-xs font-bold ${prepTab === 'checklist' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                  非常持ち出し品 ({completedCount}/{checklistList.length})
                </button>
              </div>

              {prepTab === 'levels' && (
                <div className="space-y-3 text-xs">
                  <div className="p-3.5 rounded-xl bg-purple-50 border border-purple-200">
                    <strong className="text-purple-950 block text-sm font-black">警戒レベル5: 緊急安全確保</strong>
                    <p className="text-purple-900 mt-0.5">命を守る最善の行動。建物の2階以上や高台へ直ちに退避。</p>
                  </div>
                  <div className="p-3.5 rounded-xl bg-rose-50 border border-rose-200">
                    <strong className="text-rose-950 block text-sm font-black">警戒レベル4: 避難指示 (全員避難)</strong>
                    <p className="text-rose-900 mt-0.5">危険な場所にいる方は全員、指定避難所や安全な場所へ避難完了。</p>
                  </div>
                  <div className="p-3.5 rounded-xl bg-amber-50 border border-amber-200">
                    <strong className="text-amber-950 block text-sm font-black">警戒レベル3: 高齢者等避難</strong>
                    <p className="text-amber-900 mt-0.5">避難に時間のかかる方は避難開始。一般の方も避難準備。</p>
                  </div>
                </div>
              )}

              {prepTab === 'rivers' && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  {MIYAZAKI_RIVERS_INFO.map(r => (
                    <div key={r.name} className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                      <strong className="text-sm font-bold text-slate-900 block">{r.name}</strong>
                      <p className="text-slate-600 mt-1">{r.feature}</p>
                      <a href={r.telemetryUrl} target="_blank" rel="noreferrer" className="mt-2 inline-block text-blue-600 font-bold hover:underline">
                        → リアルタイム水位・ライブカメラ
                      </a>
                    </div>
                  ))}
                </div>
              )}

              {prepTab === 'checklist' && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                  {checklistList.map(item => (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => toggleCheck(item.id)}
                      className={`p-3 rounded-xl border text-left flex justify-between items-center transition ${checkedItems[item.id] ? 'bg-blue-50 border-blue-300 text-blue-900 line-through' : 'bg-slate-50 border-slate-200 text-slate-800'}`}
                    >
                      <span>{checkedItems[item.id] ? '☑' : '☐'} {item.label}</span>
                      <span className="text-[10px] bg-white px-2 py-0.5 rounded border border-slate-200 font-bold">{item.cat}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </main>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800 text-center">
            <p className="text-slate-300 font-bold mb-1">宮崎市 洪水ハザードマップ検索（単一ファイル完結版）</p>
            <p className="text-[11px] text-slate-500">出典: 国土交通省 重ねるハザードマップ / 国土地理院 / 宮崎市防災計画</p>
          </footer>

          {/* Hotline Modal */}
          {isHotlineOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="text-lg font-black text-slate-900 mb-4 pb-2 border-b">宮崎市 緊急連絡先</h3>
                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-red-50 rounded-xl flex justify-between items-center font-bold">
                    <span>消防・救急 (119番)</span>
                    <a href="tel:119" className="px-3 py-1.5 bg-red-600 text-white rounded-lg">119</a>
                  </div>
                  <div className="p-3 bg-blue-50 rounded-xl flex justify-between items-center font-bold">
                    <span>警察 (110番)</span>
                    <a href="tel:110" className="px-3 py-1.5 bg-blue-600 text-white rounded-lg">110</a>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-xl flex justify-between items-center font-bold">
                    <span>宮崎市役所 危機管理課</span>
                    <a href="tel:0985252111" className="px-3 py-1.5 bg-slate-900 text-white rounded-lg">0985-25-2111</a>
                  </div>
                  <div className="p-3 bg-amber-50 rounded-xl flex justify-between items-center font-bold">
                    <span>災害用伝言ダイヤル</span>
                    <a href="tel:171" className="px-3 py-1.5 bg-amber-600 text-white rounded-lg">171</a>
                  </div>
                </div>
                <button onClick={() => setIsHotlineOpen(false)} className="w-full mt-5 py-2.5 bg-slate-200 hover:bg-slate-300 font-bold text-xs rounded-xl">
                  閉じる
                </button>
              </div>
            </div>
          )}

          {/* Report / Print Modal */}
          {isReportOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-2 border-b">
                  <h3 className="text-base font-black">宮崎市 洪水ハザード診断書</h3>
                  <button onClick={() => window.print()} className="px-3 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold">
                    印刷実行
                  </button>
                </div>
                <div className="text-xs space-y-3 mb-5">
                  <p><strong>対象住所:</strong> {hazardResult ? hazardResult.address : currentAddress}</p>
                  <p><strong>判定:</strong> {isSafe ? '浸水想定区域外' : `浸水想定区域内（想定浸水深: ${hazardResult.depthRangeText}）`}</p>
                  <p><strong>避難行動:</strong> {hazardResult ? hazardResult.evacuationAction : ''}</p>
                </div>
                <button onClick={() => setIsReportOpen(false)} className="w-full py-2 bg-slate-200 font-bold text-xs rounded-xl">
                  閉じる
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
