    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = (lat1 * Math.PI) / 180;
      const phi2 = (lat2 * Math.PI) / 180;
      const deltaPhi = ((lat2 - lat1) * Math.PI) / 180;
      const deltaLambda = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function latLngToTilePixel(lat, lng, zoom = 16) {
      const n = Math.pow(2, zoom);
      const xTileExact = ((lng + 180) / 360) * n;
      const latRad = (lat * Math.PI) / 180;
      const yTileExact = ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n;
      const x = Math.floor(xTileExact);
      const y = Math.floor(yTileExact);
      const px = Math.min(255, Math.max(0, Math.floor((xTileExact - x) * 256)));
      const py = Math.min(255, Math.max(0, Math.floor((yTileExact - y) * 256)));
      return { x, y, px, py };
    }

    function mapColorToRiskLevel(r, g, b, a) {
      if (a < 30) return 'none';
      const targets = [
        { level: 'above_10_0', r: 242, g: 133, b: 201 },
        { level: '5_0_to_10_0', r: 255, g: 145, b: 145 },
        { level: '3_0_to_5_0', r: 255, g: 183, b: 183 },
        { level: '0_5_to_3_0', r: 255, g: 216, b: 192 },
        { level: 'below_0_5', r: 247, g: 245, b: 169 }
      ];
      let closest = 'below_0_5';
      let minDiff = 999999;
      for (const t of targets) {
        const d = Math.sqrt(Math.pow(r - t.r, 2) + Math.pow(g - t.g, 2) + Math.pow(b - t.b, 2));
        if (d < minDiff) {
          minDiff = d;
          closest = t.level;
        }
      }
      if (minDiff > 120 && (r < 100 || g < 100 || b < 100)) return 'none';
      return closest;
    }

    async function sampleGsiFloodTile(lat, lng) {
      const zoom = 16;
      const { x, y, px, py } = latLngToTilePixel(lat, lng, zoom);
      const tileUrl = `https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/${zoom}/${x}/${y}.png`;
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const timer = setTimeout(() => resolve(null), 3500);
        img.onload = () => {
          clearTimeout(timer);
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            if (!ctx) return resolve(null);
            ctx.drawImage(img, 0, 0);
            const p = ctx.getImageData(px, py, 1, 1).data;
            resolve(mapColorToRiskLevel(p[0], p[1], p[2], p[3]));
          } catch { resolve(null); }
        };
        img.onerror = () => { clearTimeout(timer); resolve('none'); };
        img.src = tileUrl;
      });
    }

    async function geocodeAddress(query) {
      const clean = query.trim();
      if (!clean) return null;
      const match = SAMPLE_LOCATIONS.find(s => s.name.includes(clean) || s.address.includes(clean) || clean.includes(s.name) || clean.includes(s.address));
      if (match) return { lat: match.lat, lng: match.lng, displayName: match.address };

      try {
        const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(clean.startsWith('宮崎') ? clean : '宮崎市 ' + clean)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            for (const item of data) {
              if (item.geometry && Array.isArray(item.geometry.coordinates)) {
                const [lon, lat] = item.geometry.coordinates;
                const title = item.properties?.title || '';
                if (lat >= 31.65 && lat <= 32.22 && lon >= 131.10 && lon <= 131.65) {
                  return { lat, lng: lon, displayName: title.includes('宮崎') ? title : `宮崎県宮崎市 ${title}` };
                }
              }
            }
          }
        }
      } catch (e) {}

      return { lat: 31.9077, lng: 131.4202, displayName: `宮崎県宮崎市（${clean} 付近）` };
    }

    async function getGsiElevation(lat, lng) {
      try {
        const url = `https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lng}&lat=${lat}&outtype=JSON`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data.elevation === 'number') return Math.round(data.elevation * 10) / 10;
        }
      } catch {}
      return null;
    }

    function findNearbyShelters(lat, lng, maxCount = 6) {
      const withDist = MIYAZAKI_SHELTERS.map(s => {
        const d = calculateDistanceMeters(lat, lng, s.lat, s.lng);
        return { ...s, distanceMeters: d, walkingMinutes: Math.max(1, Math.round(d / 80)) };
      });
      withDist.sort((a, b) => (a.distanceMeters || 0) - (b.distanceMeters || 0));
      return withDist.slice(0, maxCount);
    }

    async function analyzeHazardForLocation(lat, lng, address) {
      const [tileRisk, elevation] = await Promise.all([
        sampleGsiFloodTile(lat, lng),
        getGsiElevation(lat, lng)
      ]);
      let riskLevel = tileRisk;
      if (riskLevel === null) {
        const distToOyodo = calculateDistanceMeters(lat, lng, 31.906, 131.422);
        if (distToOyodo < 1200) riskLevel = '0_5_to_3_0';
        else if (elevation !== null && elevation < 5) riskLevel = 'below_0_5';
        else riskLevel = 'none';
      }
      const def = INUNDATION_RANK_DEFINITIONS.find(d => d.level === riskLevel) || INUNDATION_RANK_DEFINITIONS[0];

      return {
        address,
        lat,
        lng,
        isInundationZone: riskLevel !== 'none',
        riskLevel,
        depthLabel: def.depthLabel,
        depthRangeText: def.depthRangeText,
        minDepthMeters: def.minDepth,
        maxDepthMeters: def.maxDepth,
        humanImpact: def.humanImpact,
        buildingImpact: def.buildingImpact,
        evacuationAction: def.evacuationAction,
        elevationMeters: elevation,
        timestamp: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
      };
    }
    function App() {

      const [inputQuery, setInputQuery] = useState('宮崎市橘通西1丁目1-1');

      const [isLoading, setIsLoading] = useState(true);

      const [isReportOpen, setIsReportOpen] = useState(false);

      // Checklist state
      const [checkedItems, setCheckedItems] = useState(() => {
        try {
          const s = localStorage.getItem('steep_flood_checklist');
          return s ? JSON.parse(s) : {};
        } catch { return {}; }
      });
      const [prepTab, setPrepTab] = useState('checklist');

      // Map references
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);

                    <div className="p-4 bg-canvas-mist rounded-inner border border-faint-border">
                      <span className="text-[11px] text-muted-gray font-medium block">判定状況</span>
                      <span className="text-ink-black font-semibold">{isSafe ? '区域外 (浸水想定なし)' : '浸水想定区域内'}</span>
                    </div>
                    <div className="p-4 bg-canvas-mist rounded-inner border border-faint-border">
                      <span className="text-[11px] text-muted-gray font-medium block">想定最大水深</span>
                      <span className="text-shop-violet text-xl font-bold">{hazardResult ? hazardResult.depthRangeText : '0m'}</span>
                    </div>
                  </div>

                  <div className="p-4 bg-pure-white rounded-inner border-2 border-shop-violet text-ink-black shadow-shop-soft">
                    <span className="text-[11px] uppercase tracking-wider block mb-1 text-shop-violet font-semibold">推奨避難プロトコル</span>
                    <p className="text-[13px] leading-relaxed font-medium">{hazardResult ? hazardResult.evacuationAction : '自宅待機または安全確認'}</p>
                  </div>

                  <p className="text-[11px] text-muted-gray leading-relaxed">
                    ※ 本査定書は国土地理院浸水想定タイル（大淀川水系L2想定）を基に生成された参考指標です。実際の避難時は自治体の避難指示及び防災無線に従ってください。
                  </p>
                </div>

                <button 
                  onClick={() => setIsReportOpen(false)} 
                  className="w-full mt-5 h-10 rounded-pill bg-shop-violet text-pure-white text-[13px] font-semibold cursor-pointer hover:opacity-95 shadow-shop-violet"
                >
                  確認完了
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount React Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
